<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Kalakal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160B2A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/catamaran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/kalakal.css">
<style>
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--night); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .stat b { display: block; font: 800 28px var(--display); }
  .stat span { color: var(--soft); font-size: 14px; }
  .item { background: var(--night); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .item ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
  .item .ans { color: var(--soft); font-size: 15px; }
  .item .ans b { color: var(--teal); }
  .reps { background: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <div data-nav></div>
  <main class="stack" style="gap: 28px; padding: 8px 0" id="main"><p class="muted">Loading…</p></main>
  <footer data-foot></footer>
</div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
