<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalakal: live quizzes and polls anyone can join</title>
<meta name="description" content="Quizzes, polls and party games that anyone can join in five seconds with a PIN. No app, no account.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kalakal">
<meta property="og:title" content="Kalakal: live quizzes & polls for everyone">
<meta property="og:description" content="Host quizzes and live polls on a big screen. Everyone joins with a PIN on their phone. No app, free.">
<meta property="og:image" content="https://kalakal.se/img/og-kalakal.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#160B2A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon-180.png">
<link rel="preload" href="/fonts/catamaran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/kalakal.css">
<style>
  .home-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px 0; }
  .hero { display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding: 48px 0 72px; }
  .hero-copy { flex: 1 1 440px; display: flex; flex-direction: column; gap: 22px; }
  .hero-copy h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); font-weight: 800; text-wrap: balance; }
  .join-card { flex: 1 1 360px; max-width: 460px; position: relative; margin-top: 90px; }
  .card-mascot { position: absolute; width: 190px; right: 6px; top: -150px; }
  .wordmark { width: min(300px, 70vw); height: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div data-nav></div>
  <main class="hero">
    <div class="hero-copy">
      <img class="wordmark" src="/img/logo.svg" alt="Kalakal">
      <h1>Make every room Kalakal.</h1>
      <p class="muted" style="font-size: 21px; max-width: 34rem">Quizzes and party games that anyone can join in five seconds with a PIN. No app, no account, just the whole room playing together.</p>
      <div class="row"><a class="btn btn-primary" href="/host.html">Host a free game</a><a class="btn btn-ghost" href="/create.html">Create your own quiz</a></div>
    </div>
    <form class="card join-card stack" id="join" autocomplete="off">
      <img class="mascot float card-mascot" src="/img/mascots/host.webp" alt="" width="190" height="173">
      <h2 style="font-size: 26px">Join a game</h2>
      <div class="field">
        <label for="pin">Game PIN</label>
        <input class="pin-input" id="pin" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="482 913" required>
      </div>
      <p class="error" id="err" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Enter</button>
    </form>
  </main>
  <section class="stack" id="popular" style="gap: 18px; padding-top: 12px" hidden>
    <div class="row" style="justify-content: space-between"><h2 style="font-size: 28px">Popular this week</h2><a class="btn btn-ghost btn-sm" href="/library.html">See the library</a></div>
    <div class="q-cards" id="popularGrid"></div>
  </section>
  <p class="muted" style="padding: 24px 0 0; font-size: 15px">Kalakal is Tamil slang for "awesome".</p>
  <footer data-foot></footer>
</div>
<script type="module" src="/js/home.js"></script>
</body>
</html>
