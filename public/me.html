<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My quizzes · Kalakal</title>
<meta name="theme-color" content="#160B2A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/catamaran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/kalakal.css">
<style>
  .mq { display: flex; flex-direction: column; gap: 10px; }
  .mq-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--night); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .mq-row h3 { font-size: 18px; }
  .mq-meta { display: flex; gap: 6px 12px; flex-wrap: wrap; color: var(--soft); font-size: 14px; align-items: center; margin-top: 6px; }
  .mq-act { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .mq-act button, .mq-act a { min-height: 40px; font-size: 14px; }
  @media (max-width: 680px) { .mq-row { grid-template-columns: 1fr; } .mq-act { justify-content: flex-start; } }
  .panel { background: var(--night); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .welcome { max-width: 620px; margin: 24px auto; }
  .welcome label.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; }
  .welcome label.check input { width: 24px; height: 24px; margin-top: 2px; accent-color: var(--marigold); flex-shrink: 0; }
  .danger { border-color: rgba(255,93,115,.6); }
</style>
</head>
<body>
<div class="wrap">
  <div data-nav></div>
  <main id="main"><p class="muted" style="padding: 40px 0">Loading…</p></main>
  <footer data-foot></footer>
</div>
<script type="module" src="/js/me.js"></script>
</body>
</html>
