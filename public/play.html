<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play Kalakal</title>
<meta name="theme-color" content="#160B2A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon-180.png">
<link rel="preload" href="/fonts/catamaran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/kalakal.css">
<style>
  .p-wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); flex: 1; display: flex; flex-direction: column; gap: 24px; }
  .p-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .p-name { font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .p-name .dot { width: 14px; height: 14px; border-radius: 99px; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .p-answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 340px; }
  .p-answers .answer { flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 20px; min-height: 140px; }
  .p-answers .answer svg { width: 40px; height: 40px; }
  .result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: var(--ink); }
  .result.good { background: var(--teal); }
  .result.bad { background: var(--coral); }
  .result.none { background: var(--night); color: var(--cream); }
  .big { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1.05; }
  .e-opts { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .e-opts .answer { min-height: 64px; font-size: 20px; }
  .e-opts .answer.chosen { outline: 4px solid var(--cream); outline-offset: 3px; }
  .rate { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .rate button { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--night); color: var(--cream); font-family: var(--display); font-weight: 800; font-size: 18px; cursor: pointer; }
  .rate button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--ink); }
  .sent { display: flex; flex-wrap: wrap; gap: 8px; }
  .sent span { background: var(--night); border-radius: 99px; padding: 6px 14px; font-weight: 700; }
  .qa-item { display: flex; align-items: center; gap: 12px; background: var(--night); border-radius: 14px; padding: 12px 14px; }
  .qa-item.done { opacity: .55; }
  .up { min-width: 64px; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--cream); font-weight: 800; font-family: var(--body); font-size: 17px; cursor: pointer; }
  .up[aria-pressed="true"] { background: var(--marigold); border-color: var(--marigold); color: var(--ink); }
  .ok-note { color: var(--teal); font-weight: 800; }
  .status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: var(--coral); color: var(--ink); font-weight: 800; padding: 6px 14px; border-radius: 99px; z-index: 60; font-size: 15px; }
</style>
</head>
<body>
<div class="status" id="status" role="status" hidden>Reconnecting…</div>

<section class="screen" data-screen="join">
  <form class="p-wrap" id="joinForm" autocomplete="off">
    <a class="brand" href="/"><img src="/img/icon.svg" alt="">kalakal</a>
    <div class="center" style="align-items: stretch; text-align: left">
      <h1 style="font-size: 34px">Join the fun.</h1>
      <p class="muted">Type the PIN you see on the big screen.</p>
      <div class="field"><label for="pin">Game PIN</label><input class="pin-input" id="pin" type="text" inputmode="numeric" maxlength="7" placeholder="482 913" required></div>
      <div class="field"><label for="nick">Your nickname</label><input id="nick" type="text" maxlength="16" placeholder="Spark Queen" required></div>
      <p class="error" id="joinErr" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="joinBtn">Let's Kalakal</button>
    </div>
  </form>
</section>

<section class="screen" data-screen="wait" hidden>
  <div class="p-wrap">
    <div class="p-top"><span class="p-name"><span class="dot"></span><span class="me"></span></span><span class="muted" id="waitCount"></span></div>
    <div class="center">
      <div class="float" id="waitMinni"></div>
      <h1 style="font-size: 30px" id="waitTitle">You're in!</h1>
      <p class="muted" id="waitText">See your name on the big screen? The game starts soon.</p>
    </div>
  </div>
</section>

<section class="screen" data-screen="question" hidden>
  <div class="p-wrap">
    <div class="p-top"><span class="p-name"><span class="dot"></span><span class="me"></span></span><span class="muted" id="qCount"></span></div>
    <p style="font-family: var(--display); font-weight: 700; font-size: 20px" id="qText"></p>
    <div class="p-answers" id="pAnswers"></div>
  </div>
</section>

<section class="screen" data-screen="locked" hidden>
  <div class="p-wrap"><div class="center">
    <div id="lockedShape" style="width: 120px; height: 120px; border-radius: 28px; display: flex; align-items: center; justify-content: center"></div>
    <h1 style="font-size: 28px">Answer locked in</h1>
    <p class="muted">Waiting for everyone else…</p>
  </div></div>
</section>

<section data-screen="result" hidden>
  <div class="result" id="result"></div>
</section>

<section class="screen" data-screen="engage" hidden>
  <div class="p-wrap">
    <div class="p-top"><span class="p-name"><span class="dot"></span><span class="me"></span></span><span class="muted" id="eCount"></span></div>
    <p style="font-family: var(--display); font-weight: 700; font-size: 21px" id="eText"></p>
    <div class="stack" id="eBox" style="flex: 1"></div>
  </div>
</section>

<section class="screen" data-screen="final" hidden>
  <div class="p-wrap"><div class="center" id="final"></div></div>
</section>

<section class="screen" data-screen="message" hidden>
  <div class="p-wrap"><div class="center">
    <div id="msgMinni"></div>
    <h1 style="font-size: 28px" id="msgTitle"></h1>
    <p class="muted" id="msgText"></p>
    <a class="btn btn-primary" href="/">Back to start</a>
  </div></div>
</section>

<script type="module" src="/js/play.js"></script>
</body>
</html>
